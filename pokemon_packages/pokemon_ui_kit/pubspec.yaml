name: pokemon_ui_kit
description: A Very Good Project created by Very Good CLI.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ^3.32.0

dependencies:
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  pokemon_models:
    path: ../pokemon_models


dev_dependencies:
  build_runner: ^2.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0


flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: pokemon_font
      fonts:
        - asset: lib\src\assets\fonts\pokemon_font.ttf
  assets:
    - lib/src/assets/images/types/
    - lib/src/assets/images/moves/
